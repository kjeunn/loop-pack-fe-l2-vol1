name: Quality

"on":
  push:
    # kjeunn은 주차 브랜치가 병합되는 통합 브랜치라 병합 뒤에도 한 번 돌아야 한다(사후 방어).
    # main은 upstream 동기화 전용이지만 그대로 둔다.
    branches:
      - main
      - kjeunn
  pull_request:

# 같은 PR에 연속 push하면 앞선 run은 취소한다. 통합 브랜치 push는 취소하지 않는다 —
# 병합 결과의 검증이 다음 push에 밀려 사라지면 안 된다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    # 러너 stall(pnpm setup이 7분 걸린 run이 있었다)이 무한정 점유하지 않게 한다. 정상은 2분 안이다.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.15.1
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # 아래 다섯 step은 package.json의 `check` 스크립트와 같은 목록이다.
      # 한 명령으로 묶으면 Actions 로그에 step별 타임스탬프가 남지 않아
      # 어느 검증이 느린지·어느 검증이 실패했는지 보이지 않는다. 그래서 목록을 여기 한 번 더 푼다.
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Duplicate check
        run: pnpm dupcheck
      - name: Build
        run: pnpm build
        # appOrigin은 미설정 시 throw한다. CI build는 배포가 아니므로 로컬 origin을 준다.
        env:
          APP_ORIGIN: http://localhost:3000
