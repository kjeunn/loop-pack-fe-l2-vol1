name: Deploy smoke

# 빌드·env 검사는 배포 앞에 있지만 "떠 있는 서비스가 실제로 동작하는가"는 배포 뒤에만 확인된다.
# 첫 production 배포에서 og:url이 남의 주소였을 때 빌드는 초록이었다(RFC 3.6).
# 손으로 돌리던 배포본 스모크를 여기로 옮긴다.
"on":
  deployment_status:

permissions:
  contents: read

# 연속 production 배포가 겹치면 앞 스모크는 버린다. 확인 대상은 항상 최신 production이다.
# 그룹에 environment를 넣는 이유: 넣지 않으면 preview 배포가 보내는 deployment_status도 같은 그룹에 들어와
# (job은 if로 스킵되지만 run은 시작된다) 돌고 있던 production 스모크를 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.deployment.environment }}
  cancel-in-progress: true

jobs:
  smoke:
    # Vercel 연동이 보내는 environment는 "Production"·"Preview"다(deployments API로 확인).
    # preview는 돌리지 않는다 — Standard Protection이 모든 preview를 인증 벽 뒤에 둔다.
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # deployment_status의 environment_url을 쓰지 않는다. 그 값은 배포별 생성 URL이고
      # (예: loop-pack-fe-l2-vol1-lslf1jyvt-kjeunn.vercel.app), 이 프로젝트의 Deployment Protection이
      # Standard Protection이라 생성 URL은 vercel.com/sso-api로 302된다. 공개인 건 production 도메인뿐이다.
      # 도메인이 바뀌면 여기를 고친다 — 아래 Verify 단계가 그때 원인을 알려준다.
      E2E_BASE_URL: https://loop-pack-fe-l2-vol1-indol.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # 보호 설정이 All Deployments로 바뀌거나 도메인이 바뀌면 E2E가 30s 타임아웃 29개로 죽어
      # 원인이 안 보인다. 먼저 한 번 때려 보고 원인을 문장으로 남긴다.
      - name: Verify deployment is publicly reachable and is ours
        run: |
          body=$(curl -sS --fail-with-body -w '\n%{http_code}' -- "$E2E_BASE_URL/") || {
            echo "::error::배포본에 접근하지 못했습니다. Deployment Protection 범위나 production 도메인이 바뀌었는지 확인하세요."
            exit 1
          }
          echo "GET $E2E_BASE_URL/ -> $(printf '%s' "$body" | tail -1)"
          # og:url은 metadataBase(=APP_ORIGIN)에서 나온다. 이 값이 다르면 이 주소가 더는 우리 배포가 아니다.
          # 같은 이름의 vercel.app이 남의 것이었던 사고(RFC 3.6)가 이 검사의 이유다.
          og=$(printf '%s' "$body" | grep -o 'property="og:url" content="[^"]*"' | head -1 | sed 's/.*content="//; s/"$//')
          echo "og:url = $og"
          if [ "$og" != "$E2E_BASE_URL" ]; then
            echo "::error::og:url($og)이 스모크 대상($E2E_BASE_URL)과 다릅니다. 이 주소가 우리 배포가 맞는지 확인하세요."
            exit 1
          fi
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.15.1
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # @writes 태그가 붙은 스펙은 뺀다. 주문 스펙은 서버의 ordersByUser에 실제로 주문을 넣어,
      # 배포마다 돌리면 production에 테스트 주문이 쌓인다. 그 흐름은 CI(로컬 빌드)에서 매번 돈다.
      # 로그인·세션 만료는 서명 토큰이라 서버 상태를 안 만들어 여기서도 돈다.
      - name: Smoke against deployment
        run: |
          echo "## 배포 스모크: $E2E_BASE_URL" >> "$GITHUB_STEP_SUMMARY"
          pnpm test:e2e --grep-invert "@writes"
      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-smoke-traces
          path: test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7
